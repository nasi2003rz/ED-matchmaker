services:
  postgres:
    image: postgres:16-alpine
    container_name: ed-matchmaker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ed_matchmaker
      POSTGRES_PASSWORD: ed_matchmaker_dev
      POSTGRES_DB: ed_matchmaker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
